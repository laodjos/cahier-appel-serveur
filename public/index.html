<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Cahier d'Appel — Connecté au backend</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="/vendor/react.production.min.js"></script>
<script crossorigin src="/vendor/react-dom.production.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #243B32; font-family: 'IBM Plex Sans', sans-serif; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(246,242,231,0.15); border-radius: 8px; }
  .row-flash { animation: flash 1.4s ease; }
  @keyframes flash { 0% { background: rgba(217,164,65,0.28); } 100% { background: transparent; } }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #D9A441; outline-offset: 2px; }
  input::placeholder { color: rgba(246,242,231,0.35); }
  #root { min-height: 100vh; }

  /* --- Mise en page responsive : barre latérale escamotable sur smartphone --- */
  .app-shell { display: flex; min-height: 100vh; }
  .app-sidebar { width: 240px; flex-shrink: 0; transition: transform 0.2s ease; overflow-y: auto; }
  .app-main { flex: 1; min-width: 0; padding: 26px 32px; overflow-y: auto; }
  .mobile-header { display: none; }
  .sidebar-overlay { display: none; }

  @media (max-width: 780px) {
    .mobile-header { display: flex; }
    .app-sidebar {
      position: fixed; top: 0; left: 0; height: 100vh; z-index: 100;
      transform: translateX(-100%); box-shadow: 4px 0 24px rgba(0,0,0,0.35);
    }
    .app-sidebar.ouverte { transform: translateX(0); }
    .app-main { padding: 16px; padding-top: 72px; width: 100%; }
    .sidebar-overlay.ouverte { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 90; }
    /* Les grilles à colonnes fixes deviennent illisibles en dessous de 780px : on les empile */
    .grille-responsive { display: flex !important; flex-direction: column; gap: 6px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="/app.min.js"></script>
</body>
</html>
